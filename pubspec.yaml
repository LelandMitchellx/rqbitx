name: rqbitx
description: A minimal Flutter FFI plugin to start an rqbit HTTP service.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.13.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  dio: ^5.7.0
  hooks: ^2.2.0
  native_toolchain_rust: ^1.0.7

dependency_overrides:
  code_assets: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
