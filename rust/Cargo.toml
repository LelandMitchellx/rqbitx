[package]
name = "rqbitx"
version = "0.1.0"
edition = "2024"

[lib]
name = "rqbitx"
crate-type = ["staticlib", "cdylib"]

[dependencies]
librqbit = { git = "https://github.com/ikatson/rqbit", default-features = false, features = ["http-api", "tracing-subscriber-utils", "rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
librqbit-dualstack-sockets = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
rustls-platform-verifier = { path = "rustls-platform-verifier" }
